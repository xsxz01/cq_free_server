<div class="h-screen flex items-center justify-center bg-gray-50">
  <form 
    (ngSubmit)="onSubmit()" 
    [formGroup]="loginForm"
    class="bg-white p-8 rounded-lg shadow-md w-96"
  >
    <h2 class="text-2xl font-bold mb-6 text-gray-800">用户登录</h2>
    
    <div class="mb-4">
      <label class="block text-gray-700 text-sm font-semibold mb-2">用户名</label>
      <input
        type="text"
        formControlName="username"
        class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [class.border-red-500]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
      >
      <div 
        *ngIf="loginForm.get('username')?.errors?.['required'] && loginForm.get('username')?.touched"
        class="text-red-500 text-xs mt-1"
      >
        用户名不能为空
      </div>
    </div>

    <div class="mb-6">
      <label class="block text-gray-700 text-sm font-semibold mb-2">密码</label>
      <input
        type="password"
        formControlName="password"
        class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [class.border-red-500]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
      >
      <div 
        *ngIf="loginForm.get('password')?.errors?.['required'] && loginForm.get('password')?.touched"
        class="text-red-500 text-xs mt-1"
      >
        密码不能为空
      </div>
      <div 
        *ngIf="loginForm.get('password')?.errors?.['minlength']"
        class="text-red-500 text-xs mt-1"
      >
        密码至少6位
      </div>
      <!-- 在密码字段后添加 -->
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-semibold mb-2">验证码</label>
        <div class="flex gap-2">
          <input
            type="text"
            formControlName="captcha"
            class="w-1/2 px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
          <img 
            [src]="captchaUrl" 
            class="w-1/2 h-10 cursor-pointer border rounded-md"
            (click)="refreshCaptcha()"
            alt="验证码"
          >
        </div>
      </div>
      
      <!-- 在提交按钮前添加记住我 -->
      <div class="mb-4 flex items-center">
        <input 
          type="checkbox" 
          id="rememberMe" 
          formControlName="rememberMe"
          class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500"
        >
        <label for="rememberMe" class="ml-2 text-sm text-gray-600">记住登录状态</label>
      </div>
      </div>
      <button
        type="submit"
        class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition-colors"
        [disabled]="loginForm.invalid"
      >
        登录
      </button>
      <div class="mt-4 text-center text-sm text-gray-600">
        没有账号？ 
        <a routerLink="/auth/register" class="text-blue-600 hover:underline">立即注册</a>
      </div>
    </form>
  </div>
